version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
    ignore:
      # Stay on the .NET 10 LTS line; major upgrades are a deliberate decision.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: ["/src/Starter.Api", "/client"]
    schedule:
      interval: monthly
