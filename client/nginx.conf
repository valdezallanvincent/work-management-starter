# Serves the SPA and proxies /api to the API container, so the browser sees a single origin:
# the refresh cookie stays first-party and no CORS configuration is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Headers are declared once here. Locations below use `expires` rather than add_header,
    # because any add_header inside a location would silently drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    # File names of built bundles contain a content hash, so they can be cached for a long time.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
    }

    # index.html must always be revalidated so a new deployment is picked up.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
